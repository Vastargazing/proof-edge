<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
  <title id="title">ProofEdge forecast proof flow</title>
  <desc id="desc">Five stages from DreamDEX and price inputs through sealing, Merkle anchoring on Somnia, resolution, and independent verification.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091426"/>
      <stop offset="1" stop-color="#101d35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020817" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#55d6be"/>
    </marker>
    <style>
      .box { fill: #14243e; stroke: #355071; stroke-width: 2; rx: 16; filter: url(#shadow); }
      .step { fill: #55d6be; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1.4px; }
      .head { fill: #f5f8ff; font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; }
      .copy { fill: #b9c8dc; font-family: Inter, Arial, sans-serif; font-size: 15px; }
      .code { fill: #8ee6d6; font-family: Menlo, Consolas, monospace; font-size: 14px; }
      .arrow { fill: none; stroke: #55d6be; stroke-width: 3; marker-end: url(#arrow); }
      .boundary { fill: #101b30; stroke: #e6a85c; stroke-width: 1.5; stroke-dasharray: 7 6; rx: 14; }
      .note { fill: #f1bd79; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 600; }
      .small { fill: #9fb0c7; font-family: Inter, Arial, sans-serif; font-size: 14px; }
    </style>
  </defs>

  <rect width="1280" height="480" rx="24" fill="url(#bg)"/>
  <text x="56" y="54" class="head">One forecast, carried forward without rewriting history</text>

  <rect class="box" x="50" y="92" width="210" height="210"/>
  <text x="72" y="122" class="step">01 · OBSERVE</text>
  <text x="72" y="158" class="head">Market window</text>
  <text x="72" y="190" class="copy">Spot + opening price</text>
  <text x="72" y="216" class="copy">volatility + YES book</text>
  <text x="72" y="252" class="code">p_agent</text>
  <text x="150" y="252" class="code">p_market</text>
  <text x="72" y="278" class="small">Inputs remain trusted.</text>

  <path class="arrow" d="M260 197 H294"/>

  <rect class="box" x="300" y="92" width="210" height="210"/>
  <text x="322" y="122" class="step">02 · SEAL</text>
  <text x="322" y="158" class="head">Canonical bytes</text>
  <text x="322" y="190" class="copy">market · expiry · model</text>
  <text x="322" y="216" class="copy">probabilities · nonce</text>
  <text x="322" y="252" class="code">Keccak-256</text>
  <text x="322" y="278" class="small">One immutable commitment.</text>

  <path class="arrow" d="M510 197 H544"/>

  <rect class="box" x="550" y="92" width="210" height="210"/>
  <text x="572" y="122" class="step">03 · ANCHOR</text>
  <text x="572" y="158" class="head">Merkle batch</text>
  <text x="572" y="190" class="copy">leaves → root</text>
  <text x="572" y="216" class="copy">root + ledger head</text>
  <text x="572" y="252" class="code">Somnia tx &lt; expiry</text>
  <text x="572" y="278" class="small">Public chain timestamp.</text>

  <path class="arrow" d="M760 197 H794"/>

  <rect class="box" x="800" y="92" width="180" height="210"/>
  <text x="822" y="122" class="step">04 · RESOLVE</text>
  <text x="822" y="158" class="head">Reveal</text>
  <text x="822" y="190" class="copy">preimage + proof</text>
  <text x="822" y="216" class="copy">on-chain outcome</text>
  <text x="822" y="252" class="code">YES = 1 · NO = 0</text>
  <text x="822" y="278" class="small">No backfilling.</text>

  <path class="arrow" d="M980 197 H1014"/>

  <rect class="box" x="1020" y="92" width="210" height="210"/>
  <text x="1042" y="122" class="step">05 · VERIFY</text>
  <text x="1042" y="158" class="head">Check + score</text>
  <text x="1042" y="190" class="copy">bytes · Merkle · receipt</text>
  <text x="1042" y="216" class="copy">expiry · scoped roots</text>
  <text x="1042" y="252" class="code">Brier (p − y)²</text>
  <text x="1042" y="278" class="small">Agent vs market.</text>

  <rect class="boundary" x="50" y="350" width="1180" height="82"/>
  <text x="76" y="382" class="note">PROVEN</text>
  <text x="160" y="382" class="small">Anchored bytes, membership, chain time, on-chain outcome, and roots inside the declared scope.</text>
  <text x="76" y="411" class="note">NOT PROVEN</text>
  <text x="190" y="411" class="small">Feed truth, continuous uptime, markets missed before anchoring, or roots outside the chosen scope.</text>
</svg>
